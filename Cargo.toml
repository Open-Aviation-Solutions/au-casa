[package]
name = "au-casa"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "CASA (Australia) Part 61 rules that the ICAO-universal icao-shared-kernel leaves out: aircraft classification, simulator recognition and titles of licence."
repository = "https://github.com/Open-Aviation-Solutions/au-casa"
readme = "README.md"
include = ["/src", "/tests", "/README.md", "/LICENSE"]

[lib]
name = "au_casa"
path = "src/lib.rs"

[dependencies]
# Released as patch versions, so pinned exactly.
icao-shared-kernel = "=0.1.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
rstest = "0.23"
serde_json = "1"
