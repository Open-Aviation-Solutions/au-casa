[package]
name = "au-casa"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "CASA (Australia) Part 61 rules that the ICAO-universal icao-shared-kernel leaves out: aircraft classification, simulator recognition and titles of licence."
repository = "https://github.com/Open-Aviation-Solutions/au-casa"
readme = "README.md"
include = ["/src", "/tests", "/README.md", "/LICENSE"]

[lib]
name = "au_casa"
path = "src/lib.rs"

[dependencies]
# Both are shared with sibling country crates (au-casa#24), so they are taken
# by a compatible range, not pinned exactly: Cargo then builds one copy of each
# for a consumer that has au-casa and a sibling, and their types are the same
# types. Each releases a change that could alter a classification or a title
# as a minor version, which a caret range does not take up; a minor release is
# taken by the country crates together.
icao-shared-kernel = "^0.1.3"
aircraft-type-descriptions = "^0.1.0"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
time = "0.3"

[dev-dependencies]
rstest = "0.23"
serde_json = "1"
time = { version = "0.3", features = ["macros"] }
