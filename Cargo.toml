[package]
name = "au-casa"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "CASA (Australia) national aviation regulatory package: derives Part 61 aircraft classification from ICAO Doc 8643 type designators."
publish = false

[lib]
name = "au_casa"
path = "src/lib.rs"

[dependencies]
# Released as patch versions, so pinned exactly.
icao-shared-kernel = "=0.1.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
time = "0.3"

[dev-dependencies]
rstest = "0.23"
serde_json = "1"
time = { version = "0.3", features = ["macros"] }
